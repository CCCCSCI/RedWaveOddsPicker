<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #f4f4f9;
    transition: background-color 0.3s ease;
  }

  h1 {
    font-size: 4rem;
    color: #222;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .button-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    padding: 0.75rem 2rem;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s ease, background-color 0.2s ease;
  }

  button:hover {
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }
</style>
</head>
<body>
  <h1>Hello World</h1>
  <div class="button-row">
    <button id="colorBtn">Change Background Color</button>
    <button id="textColorBtn">Change Text to Complementary Color</button>
  </div>

  <script>
    const backgroundButton = document.getElementById('colorBtn');
    const textButton = document.getElementById('textColorBtn');
    const title = document.querySelector('h1');

    function hslToRgb(h, s, l) {
      s /= 100;
      l /= 100;

      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;

      let r = 0;
      let g = 0;
      let b = 0;

      if (h >= 0 && h < 60) {
        r = c; g = x; b = 0;
      } else if (h >= 60 && h < 120) {
        r = x; g = c; b = 0;
      } else if (h >= 120 && h < 180) {
        r = 0; g = c; b = x;
      } else if (h >= 180 && h < 240) {
        r = 0; g = x; b = c;
      } else if (h >= 240 && h < 300) {
        r = x; g = 0; b = c;
      } else {
        r = c; g = 0; b = x;
      }

      return `rgb(${Math.round((r + m) * 255)}, ${Math.round((g + m) * 255)}, ${Math.round((b + m) * 255)})`;
    }

    function rgbToHsl(r, g, b) {
      r /= 255;
      g /= 255;
      b /= 255;

      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      let h;
      const l = (max + min) / 2;
      const d = max - min;
      const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));

      if (d === 0) {
        h = 0;
      } else if (max === r) {
        h = 60 * (((g - b) / d) % 6);
      } else if (max === g) {
        h = 60 * ((b - r) / d + 2);
      } else {
        h = 60 * ((r - g) / d + 4);
      }

      return {
        h: (h + 360) % 360,
        s: s * 100,
        l: l * 100
      };
    }

    function getRandomColor() {
      const hue = Math.floor(Math.random() * 360);
      const saturation = Math.floor(Math.random() * 51) + 50;
      const lightness = Math.floor(Math.random() * 31) + 35;
      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function getComplementaryTextColor() {
      const currentBg = getComputedStyle(document.body).backgroundColor;
      const [r, g, b] = currentBg.match(/\d+/g).map(Number);
      const { h, l } = rgbToHsl(r, g, b);
      // Split-complementary hue avoids the harsh clash of an exact 180° opposite
      const hueOffset = Math.floor(Math.random() * 61) - 30;
      const complementaryHue = (h + 150 + hueOffset + 360) % 360;
      const saturation = Math.floor(Math.random() * 26) + 55;
      // Push lightness away from the background's lightness so the text stays readable
      const lightness = l > 50 ? Math.floor(Math.random() * 21) + 20 : Math.floor(Math.random() * 21) + 65;
      return `hsl(${complementaryHue}, ${saturation}%, ${lightness}%)`;
    }

    backgroundButton.addEventListener('click', () => {
      const randomColor = getRandomColor();
      document.body.style.backgroundColor = randomColor;
    });

    textButton.addEventListener('click', () => {
      title.style.color = getComplementaryTextColor();
    });
  </script>
</body>
</html>
